<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Library Redesign · CPS613 Group 25 prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="desktop" id="desktop">
  <div class="desktop-icons" id="desktop-icons"></div>

  <section class="win-frame window" id="steam-window" aria-label="Steam">
    <header class="titlebar drag-handle" id="titlebar">
      <nav class="menubar" aria-label="Steam menu">
        <button class="menu-btn" data-menu="steam">Steam</button>
        <button class="menu-btn" data-menu="view">View</button>
        <button class="menu-btn" data-menu="friends">Friends</button>
        <button class="menu-btn" data-menu="games">Games</button>
        <button class="menu-btn" data-menu="help">Help</button>
      </nav>
      <div class="titlebar-tools">
        <button class="tool-btn" data-action="stub" data-name="Big Picture Mode" title="Big Picture Mode" aria-label="Big Picture Mode">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
        <button class="tool-btn" data-action="stub" data-name="Notifications" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        </button>
        <button class="account-btn" data-action="stub" data-name="Account">
          <span class="avatar" aria-hidden="true"></span><span class="account-name"></span><span class="wallet">$12.40</span>
        </button>
      </div>
      <div class="win-controls">
        <button data-action="minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-action="maximize" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8"/></svg></button>
        <button data-action="close" class="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>

    <nav class="navbar" aria-label="Main">
      <div class="history-btns">
        <button data-action="back" id="nav-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button data-action="forward" id="nav-fwd" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <span class="wordmark">STEAM</span>
      <button class="nav-link" data-action="stub" data-name="Store">Store</button>
      <button class="nav-link active" data-action="home">Library</button>
      <button class="nav-link" data-action="stub" data-name="Community">Community</button>
      <button class="nav-link profile-link" data-action="stub" data-name="Profile"></button>
    </nav>

    <div class="library">
      <aside class="sidebar" aria-label="Library sidebar">
        <button class="home-row" data-action="home">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Home
        </button>

        <div class="filter-toggle" role="group" aria-label="Show games">
          <button data-action="filter" data-f="all">All</button>
          <button data-action="filter" data-f="installed">Installed</button>
          <button data-action="filter" data-f="recent">Recent</button>
        </div>

        <div class="filterbar">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
            <input id="search" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search your library">
          </label>
          <button class="icon-btn" data-action="stub" data-name="Advanced filters" title="Advanced filters" aria-label="Advanced filters">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          </button>
        </div>

        <div class="list-head" id="list-head" aria-live="polite"></div>
        <div class="game-list" id="game-list"></div>
      </aside>

      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <footer class="bottombar">
      <button class="bottom-btn" data-action="stub" data-name="Add a Game">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add a Game
      </button>
      <div class="downloads" id="downloads"></div>
      <button class="bottom-btn" data-action="stub" data-name="Friends &amp; Chat">
        Friends &amp; Chat <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/></svg>
      </button>
    </footer>
  </section>

  <div class="taskbar" role="toolbar" aria-label="Taskbar">
    <button class="tb-reset" data-action="reset" title="Reset demo (Ctrl+Alt+0)">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg> Reset demo
    </button>
    <div class="taskbar-center">
      <button class="tb-btn" data-action="stub" data-name="Start" aria-label="Start">
        <span class="start-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <button class="tb-btn" data-action="stub" data-name="Search" aria-label="Search">
        <svg viewBox="0 0 24 24" class="tb-search"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      </button>
      <button class="tb-btn" data-action="stub" data-name="File Explorer" aria-label="File Explorer">
        <span class="folder-icon" aria-hidden="true"></span>
      </button>
      <button class="tb-btn tb-app tb-steam" id="tb-steam" data-action="taskbar-steam" aria-label="Steam">
        <span class="steam-icon" aria-hidden="true"></span>
      </button>
    </div>
    <div class="taskbar-right">
      <button class="tray" data-action="stub" data-name="Quick settings" aria-label="Network and sound">
        <svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <button class="clock" data-action="stub" data-name="Calendar"><span id="clock-time"></span><span id="clock-date"></span></button>
    </div>
  </div>
</div>

<div id="menu-root"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
